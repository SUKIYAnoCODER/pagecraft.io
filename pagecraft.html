<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Page Craft</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #185abd;
    --blue-hover: #e8f0fe;
    --border: #d2d0ce;
    --hover: #f3f2f1;
    --text: #323130;
    --page-width: 210mm;
    --page-height: 297mm;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        "Segoe UI",
        "Yu Gothic",
        "Meiryo",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background: #f3f2f1;
    color: var(--text);

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* =====================================================
   上部バー
===================================================== */

.topbar {
    height: 48px;
    min-height: 48px;

    background: white;
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 12px;
    gap: 10px;

    z-index: 20;
}

.logo {
    font-size: 19px;
    font-weight: 700;
    color: var(--blue);
    white-space: nowrap;
}

.document-name {
    height: 32px;
    width: 230px;

    border: 1px solid transparent;
    border-radius: 4px;

    padding: 0 8px;

    font-size: 14px;
    outline: none;
}

.document-name:hover,
.document-name:focus {
    background: #f3f2f1;
    border-color: #ddd;
}

.top-actions {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 4px;
}

/* =====================================================
   リボン
===================================================== */

.ribbon {
    background: white;
    border-bottom: 1px solid var(--border);

    flex-shrink: 0;

    z-index: 15;
}

.ribbon-row {
    min-height: 54px;

    display: flex;
    align-items: center;

    gap: 4px;
    padding: 5px 8px;

    overflow-x: auto;
    overflow-y: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: thin;
}

.ribbon-group {
    display: flex;
    align-items: center;
    gap: 3px;

    min-height: 40px;

    padding: 0 7px;

    border-right: 1px solid #e1dfdd;

    flex-shrink: 0;
}

.ribbon-group:last-child {
    border-right: none;
}

/* =====================================================
   ボタン
===================================================== */

.tool-btn {
    min-width: 36px;
    height: 36px;

    padding: 0 8px;

    border: 1px solid transparent;
    border-radius: 5px;

    background: transparent;

    color: var(--text);

    display: inline-flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;

    cursor: pointer;

    /*
     * タッチ操作でブラウザが勝手に選択を変更しにくくする
     */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;

    user-select: none;
    -webkit-user-select: none;
}

.tool-btn:hover {
    background: var(--hover);
    border-color: #ddd;
}

.tool-btn:active {
    background: var(--blue-hover);
}

.tool-btn.bold {
    font-weight: bold;
}

.tool-btn.italic {
    font-style: italic;
}

.tool-btn.underline {
    text-decoration: underline;
}

.tool-btn.strike {
    text-decoration: line-through;
}

.tool-btn.big {
    font-size: 20px;
}

.tool-btn.primary {
    color: var(--blue);
    font-weight: bold;
}

/* =====================================================
   セレクト
===================================================== */

select {
    height: 36px;

    border: 1px solid #c8c6c4;
    border-radius: 5px;

    background: white;

    padding: 0 8px;

    font-size: 14px;

    outline: none;

    touch-action: manipulation;
}

select:focus {
    border-color: var(--blue);
}

#fontName {
    width: 145px;
}

#fontSize {
    width: 90px;
}

/* =====================================================
   カラー
===================================================== */

.color-control {
    position: relative;

    width: 38px;
    height: 38px;

    flex-shrink: 0;
}

.color-button {
    width: 38px;
    height: 38px;

    border: 1px solid transparent;
    border-radius: 5px;

    background: transparent;

    cursor: pointer;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.color-button:hover {
    background: var(--hover);
}

.text-color-icon {
    display: inline-block;

    font-weight: bold;
    font-size: 19px;

    line-height: 22px;

    border-bottom: 4px solid red;
}

.highlight-icon {
    display: inline-block;

    padding: 2px 5px;

    background: yellow;

    border-radius: 2px;
}

.color-palette {
    position: fixed;

    display: none;

    width: 190px;

    background: white;

    border: 1px solid #aaa;
    border-radius: 7px;

    padding: 10px;

    box-shadow: 0 7px 22px rgba(0,0,0,.25);

    z-index: 1000;
}

.color-palette.show {
    display: grid;

    grid-template-columns: repeat(6, 1fr);

    gap: 7px;
}

.color-item {
    width: 23px;
    height: 23px;

    border: 1px solid #777;
    border-radius: 4px;

    cursor: pointer;

    touch-action: manipulation;
}

.color-item:hover {
    transform: scale(1.12);
}

/* =====================================================
   編集エリア
===================================================== */

.editor-container {
    flex: 1;

    overflow: auto;

    padding: 35px 20px 70px;

    -webkit-overflow-scrolling: touch;
}

.pages {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 25px;
}

/* =====================================================
   A4
===================================================== */

.a4-page {
    width: var(--page-width);
    min-height: var(--page-height);

    background: white;

    padding: 25mm;

    box-shadow:
        0 3px 15px rgba(0,0,0,.15);

    outline: none;

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    font-size: 11pt;
    line-height: 1.7;

    color: black;

    word-break: break-word;
    overflow-wrap: anywhere;

    /*
     * iOSで文字選択できるようにする
     */
    user-select: text;
    -webkit-user-select: text;

    /*
     * タッチスクロールはページ内で通常動作
     */
    touch-action: manipulation;
}

.a4-page:focus {
    box-shadow:
        0 3px 15px rgba(0,0,0,.15),
        0 0 0 1px rgba(24,90,189,.18);
}

.a4-page:empty::before {
    content: "ここに文章を入力してください...";
    color: #999;
    pointer-events: none;
}

.a4-page a {
    color: #0563c1;
    text-decoration: underline;
}

/* =====================================================
   ステータスバー
===================================================== */

.statusbar {
    height: 32px;
    min-height: 32px;

    background: white;

    border-top: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 10px;

    font-size: 12px;

    z-index: 20;
}

.status-left {
    display: flex;
    gap: 16px;
}

.status-right {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 7px;
}

.zoom-slider {
    width: 120px;
}

.zoom-value {
    width: 42px;
    text-align: center;
}

/* =====================================================
   モーダル
===================================================== */

.modal-bg {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.4);

    z-index: 2000;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(430px, 90vw);

    background: white;

    border-radius: 8px;

    padding: 20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.3);
}

.modal h2 {
    margin-bottom: 15px;
    font-size: 18px;
}

.modal input {
    width: 100%;
    height: 40px;

    border: 1px solid #aaa;
    border-radius: 5px;

    padding: 0 10px;

    font-size: 15px;

    outline: none;
}

.modal input:focus {
    border-color: var(--blue);
}

.modal-buttons {
    margin-top: 16px;

    display: flex;
    justify-content: flex-end;

    gap: 8px;
}

.modal-btn {
    height: 38px;

    border: none;
    border-radius: 5px;

    padding: 0 18px;

    cursor: pointer;
}

.modal-btn.cancel {
    background: #eee;
}

.modal-btn.ok {
    background: var(--blue);
    color: white;
}

/* =====================================================
   モバイル
===================================================== */

@media (max-width: 700px) {

    .topbar {
        padding: 0 8px;
    }

    .logo {
        font-size: 16px;
    }

    .document-name {
        width: 150px;
    }

    .top-actions {
        gap: 2px;
    }

    .ribbon-row {
        padding: 5px;
    }

    .ribbon-group {
        padding: 0 5px;
    }

    .tool-btn {
        min-width: 40px;
        height: 40px;
        font-size: 15px;
    }

    select {
        height: 40px;
        font-size: 15px;
    }

    #fontName {
        width: 135px;
    }

    #fontSize {
        width: 85px;
    }

    .editor-container {
        padding: 20px 10px 60px;
    }

    /*
     * モバイルではA4を縮小表示。
     * 編集時もページの比率を保つ。
     */
    .a4-page {
        transform-origin: top center;
    }

    .statusbar {
        height: 36px;
        min-height: 36px;
    }

    .status-left {
        gap: 8px;
    }

    .status-left span:nth-child(2) {
        display: none;
    }

    .zoom-slider {
        width: 90px;
    }
}

/* =====================================================
   印刷
===================================================== */

@media print {

    @page {
        size: A4;
        margin: 0;
    }

    body {
        background: white;
        overflow: visible;
    }

    .topbar,
    .ribbon,
    .statusbar {
        display: none !important;
    }

    .editor-container {
        padding: 0;
        overflow: visible;
    }

    .pages {
        gap: 0;
    }

    .a4-page {
        width: 210mm;
        min-height: 297mm;

        height: 297mm;

        padding: 25mm;

        box-shadow: none;

        page-break-after: always;

        overflow: hidden;

        transform: none !important;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     上部バー
===================================================== -->

<div class="topbar">

    <div class="logo">
        Word
    </div>

    <input
        id="documentName"
        class="document-name"
        value="新しい文書"
        aria-label="文書名"
    >

    <div class="top-actions">

        <button
            class="tool-btn"
            onpointerdown="toolbarAction(event, 'newDocument')"
            title="新規文書">
            📄
        </button>

        <button
            class="tool-btn"
            onpointerdown="toolbarAction(event, 'saveFile')"

        <button

        <button
            class="tool-btn"
            onpointerdown="toolbarAction(event, 'print')"

            🖨
        </button>

</div>


<!-- =====================================================
     リボン
===================================================== -->

<div class="ribbon">

<div class="ribbon-row">

    <!-- Undo / Redo -->

    <div class="ribbon-group">

        <button
            class="tool-btn big"
            onpointerdown="toolbarAction(event, 'undo')"

        </button>

        <button
            class="tool-btn big"
            onpointerdown="toolbarAction(event, 'redo')"
            title="やり直す">
            ↷
        </button>

    </div>


    <!-- フォント -->

    <div class="ribbon-group">

        <select
            id="fontName"
            onpointerdown="saveSelection()"
            onchange="fontCommand('fontName', this.value)"
            title="フォント">

            <option value="Yu Gothic">

            </option>

                游明朝
            </option>

            <option value="Meiryo">

            </option>

            <option value="MS Gothic">
                MS ゴシック
            </option>

            <option value="MS Mincho">
                MS 明朝
            </option>

            <option value="Arial">
                Arial
            </option>

                Times New Roman
            </option>

        </select>


        <select
            id="fontSize"
            onpointerdown="saveSelection()"
            onchange="fontCommand('fontSize', this.value)"
            title="文字サイズ">

            <option value="1">8 pt</option>
            <option value="2">9 pt</option>
            <option value="3" selected>11 pt</option>
            <option value="4">14 pt</option>
            <option value="5">18 pt</option>
            <option value="6">24 pt</option>
            <option value="7">36 pt</option>

        </select>

    </div>


    <!-- 文字装飾 -->

    <div class="ribbon-group">

        <button
            class="tool-btn bold"
            onpointerdown="toolbarAction(event, 'bold')"
            title="太字">
            B
        </button>

        <button
            class="tool-btn italic"
            onpointerdown="toolbarAction(event, 'italic')"
            title="斜体">
            I
        </button>

        <button
            class="tool-btn underline"
            onpointerdown="toolbarAction(event, 'underline')"
            title="下線">
            U
        </button>

        <button
            class="tool-btn strike"
            onpointerdown="toolbarAction(event, 'strikeThrough')"
            title="取り消し線">
            abc
        </button>

    </div>


    <!-- 色 -->

    <div class="ribbon-group">

        <div class="color-control">

            <button
                id="textColorButton"
                class="color-button"
                onpointerdown="openPalette(event, 'textPalette')"
                title="文字色">

                <span class="text-color-icon">
                    A
                </span>

            </button>

        </div>


        <div class="color-control">

            <button
                id="highlightButton"

                onpointerdown="openPalette(event, 'highlightPalette')"
                title="蛍光ペン">

                <span class="highlight-icon">
                    🖍
                </span>

            </button>

        </div>


        <button

            onpointerdown="toolbarAction(event, 'removeFormat')"

    <!-- 整列 -->

    <div class="ribbon-group">

        <button

        <button

    <!-- インデント -->

    <!-- その他 -->

    <div class="ribbon-group">

        <button

            onpointerdown="toolbarAction(event, 'link')"

        </button>

        <button

            onpointerdown="toolbarAction(event, 'horizontalRule')"

        </button>

</div>


<!-- =====================================================
     編集エリア
===================================================== -->

<div
    class="editor-container"
    id="editorContainer">

    <div class="pages">

        <div
            id="editor"
            class="a4-page"
            contenteditable="true"
            spellcheck="true">

            <h1>新しい文書</h1>

            <p>
                ここに文章を入力してください。
            </p>

        </div>

    </div>

</div>


<!-- =====================================================
     ステータス
===================================================== -->

<div class="statusbar">

    <div class="status-left">

        <span id="pageInfo">
            1ページ
        </span>

        <span id="wordCount">
            0文字
        </span>

        <span id="saveStatus">
            保存済み
        </span>

    </div>


    <div class="status-right">

        <button
            class="tool-btn"
            onpointerdown="toolbarAction(event, 'zoomOut')">
            −
        </button>

        <input
            id="zoomSlider"
            class="zoom-slider"
            type="range"
            min="50"
            max="150"
            value="100"

        <span
            id="zoomValue"
            class="zoom-value">

        <button

</div>

     カラーパレット

<div
    id="textPalette"

</div>

<div
    id="highlightPalette"

</div>


<!-- =====================================================
     リンクモーダル
===================================================== -->

    id="linkModal"
    class="modal-bg">

    <div class="modal">

        <h2>
            リンクを挿入
        </h2>

        <input
            id="linkInput"
            type="url"
            placeholder="https://example.com">

        <div class="modal-buttons">

            <button
                class="modal-btn cancel"
                onclick="closeLinkModal()">
                キャンセル
            </button>

            <button
                class="modal-btn ok"
                onclick="confirmLink()">
                挿入
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   エディタ取得
========================================================= */

const editor =
    document.getElementById("editor");


/* =========================================================
   選択範囲
========================================================= */

let savedRange = null;


/*
 * 現在の選択範囲を保存
 */
function saveSelection() {

    const selection =
        window.getSelection();

    if (!selection ||
        selection.rangeCount === 0) {

        return;
    }

    const range =
        selection.getRangeAt(0);

    if (
        editor.contains(
            range.commonAncestorContainer
        )
    ) {

        savedRange =
            range.cloneRange();
    }
}


/*
 * 選択範囲を復元
 */
function restoreSelection() {

    if (!savedRange) {

        editor.focus();

        return;
    }

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        savedRange
    );
}


/* =========================================================
   ツールバー操作
========================================================= */

/*
 * 非常に重要。
 *
 * clickではなくpointerdownで処理する。
 *
 * iPad / iPhone Safariでは、
 * ツールバーをタップした瞬間に
 * contenteditableの選択が失われる場合がある。
 *
 * pointerdownでpreventDefaultすることで
 * その問題を回避する。
 */

function toolbarAction(
    event,
    action,
    value = null
) {

    event.preventDefault();

    /*
     * ツールバー操作前に選択保存
     */
    saveSelection();


    /* =========================
       特殊操作
    ========================= */

    if (action === "newDocument") {

        newDocument();

        return;
    }


    if (action === "saveFile") {

        saveHTML();

        return;
    }


    if (action === "loadFile") {

        loadHTML();

        return;
    }


    if (action === "print") {

        window.print();

        return;
    }


    if (action === "link") {

        openLinkModal();

        return;
    }


    if (action === "selectAll") {

        selectAllText();

        return;
    }


    if (action === "horizontalRule") {

        restoreSelection();

        document.execCommand(
            "insertHorizontalRule"
        );

        saveSelection();

        updateStatus();
        autoSave();

        return;
    }


    if (action === "zoomIn") {

        changeZoom(10);

        return;
    }


    if (action === "zoomOut") {

        changeZoom(-10);

        return;
    }


    /* =========================
       通常の書式
    ========================= */

    restoreSelection();

    document.execCommand(
        action,
        false,
        value
    );

    saveSelection();

    updateStatus();

    autoSave();
}


/* =========================================================
   フォント
========================================================= */

function fontCommand(
    command,
    value
) {

    /*
     * selectを操作するときに
     * Safariが選択範囲を失うため、
     * onchangeより前に保存したRangeを使う。
     */

    restoreSelection();

    document.execCommand(
        command,
        false,
        value
    );

    saveSelection();

    updateStatus();

    autoSave();

    editor.focus();
}


/* =========================================================
   selectionchange
========================================================= */

document.addEventListener(
    "selectionchange",
    function () {

        const selection =
            window.getSelection();

        if (!selection ||
            selection.rangeCount === 0) {

            return;
        }

        const range =
            selection.getRangeAt(0);

        if (
            editor.contains(
                range.commonAncestorContainer
            )
        ) {

            savedRange =
                range.cloneRange();
        }

    }
);


/* =========================================================
   カラー
========================================================= */

const colors = [

    "#000000",
    "#ffffff",

    "#7f7f7f",
    "#c00000",
    "#ff0000",

    "#ffc000",
    "#ffff00",

    "#92d050",
    "#00b050",

    "#00b0f0",
    "#0070c0",

    "#7030a0",

    "#833c0c",

    "#ff00ff",
    "#00ffff",

    "#808000",
    "#800080",
    "#008080"

];


function createPalette(
    paletteId,
    type
) {

    const palette =
        document.getElementById(
            paletteId
        );

    colors.forEach(
        function(color) {

            const item =
                document.createElement(
                    "button"
                );

            item.className =
                "color-item";

            item.type =
                "button";

            item.style.backgroundColor =
                color;

            item.title =
                color;


            /*
             * pointerdownで処理する。
             */
            item.addEventListener(
                "pointerdown",
                function(event) {

                    event.preventDefault();

                    restoreSelection();

                    if (type === "text") {

                        document.execCommand(
                            "foreColor",
                            false,
                            color
                        );

                    } else {

                        document.execCommand(
                            "hiliteColor",
                            false,
                            color
                        );

                    }

                    saveSelection();

                    palette.classList
                        .remove("show");

                    updateStatus();

                    autoSave();

                }
            );

            palette.appendChild(item);

        }
    );
}


createPalette(
    "textPalette",
    "text"
);

createPalette(
    "highlightPalette",
    "highlight"
);


/* =========================================================
   パレット位置
========================================================= */

function openPalette(
    event,
    id
) {

    event.preventDefault();

    saveSelection();

    const palette =
        document.getElementById(id);

    const button =
        event.currentTarget;

    const rect =
        button.getBoundingClientRect();


    /*
     * すべて閉じる
     */

    document
        .querySelectorAll(
            ".color-palette"
        )
        .forEach(
            function(p) {

                p.classList.remove(
                    "show"
                );

            }
        );


    palette.classList.add("show");


    /*
     * 画面内に収まる位置にする
     */

    let left =
        rect.left;

    let top =
        rect.bottom + 6;


    if (
        left + 190 >
        window.innerWidth
    ) {

        left =
            window.innerWidth - 200;
    }


    if (
        top + 180 >
        window.innerHeight
    ) {

        top =
            rect.top - 190;
    }


    palette.style.left =
        Math.max(5, left) + "px";

    palette.style.top =
        Math.max(5, top) + "px";
}


/* =========================================================
   パレット外タップ
========================================================= */

document.addEventListener(
    "pointerdown",
    function(event) {

        if (
            !event.target.closest(
                ".color-control"
            ) &&
            !event.target.closest(
                ".color-palette"
            )
        ) {

            document
                .querySelectorAll(
                    ".color-palette"
                )
                .forEach(
                    function(p) {

                        p.classList
                            .remove("show");

                    }
                );
        }

    }
);


/* =========================================================
   リンク
========================================================= */

function openLinkModal() {

    saveSelection();

    document
        .getElementById("linkInput")
        .value = "";

    document
        .getElementById("linkModal")
        .classList.add("show");

    setTimeout(
        function() {

            document
                .getElementById("linkInput")
                .focus();

        },
        50
    );
}


function confirmLink() {

    const url =
        document
            .getElementById("linkInput")
            .value
            .trim();

    if (!url) {

        closeLinkModal();

        return;
    }


    restoreSelection();

    document.execCommand(
        "createLink",
        false,
        url
    );

    saveSelection();

    closeLinkModal();

    updateStatus();

    autoSave();
}


function closeLinkModal() {

    document
        .getElementById("linkModal")
        .classList
        .remove("show");
}


/* =========================================================
   全選択
========================================================= */

function selectAllText() {

    editor.focus();

    const range =
        document.createRange();

    range.selectNodeContents(
        editor
    );

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(range);

    saveSelection();
}


/* =========================================================
   ズーム
========================================================= */

let currentZoom = 100;


function setZoom(value) {

    currentZoom =
        Number(value);

    document
        .getElementById(
            "zoomValue"
        )
        .textContent =
        currentZoom + "%";

    document
        .getElementById(
            "zoomSlider"
        )
        .value =
        currentZoom;


    /*
     * PCではzoomを利用。
     *
     * モバイルでもページ全体を
     * 拡大縮小できる。
     */

    editor.style.zoom =
        currentZoom / 100;
}


function changeZoom(amount) {

    let value =
        currentZoom + amount;

    value =
        Math.max(
            50,
            Math.min(
                150,
                value
            )
        );

    setZoom(value);
}


/* =========================================================
   ステータス
========================================================= */

function updateStatus() {

    const text =
        editor.innerText || "";

    const chars =
        text
            .replace(/\s/g, "")
            .length;

    document
        .getElementById(
            "wordCount"
        )
        .textContent =
        chars + "文字";
}


/* =========================================================
   自動保存
========================================================= */

let autoSaveTimer = null;


function autoSave() {

    clearTimeout(
        autoSaveTimer
    );

    document
        .getElementById(
            "saveStatus"
        )
        .textContent =
        "保存中...";


    autoSaveTimer =
        setTimeout(
            function() {

                localStorage.setItem(
                    "wordEditorContent",
                    editor.innerHTML
                );

                localStorage.setItem(
                    "wordEditorName",
                    document
                        .getElementById(
                            "documentName"
                        )
                        .value
                );


                document
                    .getElementById(
                        "saveStatus"
                    )
                    .textContent =
                    "保存済み";

            },
            500
        );
}


/* =========================================================
   自動復元
========================================================= */

function restoreAutoSave() {

    const content =
        localStorage.getItem(
            "wordEditorContent"
        );

    const name =
        localStorage.getItem(
            "wordEditorName"
        );


    if (content !== null) {

        editor.innerHTML =
            content;
    }


    if (name !== null) {

        document
            .getElementById(
                "documentName"
            )
            .value =
            name;
    }

    updateStatus();
}


/* =========================================================
   HTML保存
========================================================= */

function saveHTML() {

    autoSave();

    const name =
        document
            .getElementById(
                "documentName"
            )
            .value
            .trim() ||
        "document";


    const html = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${escapeHTML(name)}</title>

<style>

body {
    background:#eeeeee;
    margin:0;
}

.page {
    width:210mm;
    min-height:297mm;

    padding:25mm;

    margin:20px auto;

    background:white;

    box-sizing:border-box;

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    font-size:11pt;

    line-height:1.7;

    word-break:break-word;
}

@media print {

    body {
        background:white;
    }

    .page {
        margin:0;
        box-shadow:none;
        page-break-after:always;
    }

}

</style>

</head>

<body>

<div class="page">
${editor.innerHTML}
</div>

</body>
</html>`;


    const blob =
        new Blob(
            [html],
            {
                type:
                    "text/html;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        name + ".html";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        function() {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    document
        .getElementById(
            "saveStatus"
        )
        .textContent =
        "保存済み";
}


/* =========================================================
   HTML読み込み
========================================================= */

function loadHTML() {

    const input =
        document.createElement(
            "input"
        );

    input.type =
        "file";

    input.accept =
        ".html,.htm";


    input.onchange =
        function() {

            const file =
                input.files[0];

            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function() {

                    const parser =
                        new DOMParser();


                    const doc =
                        parser.parseFromString(
                            reader.result,
                            "text/html"
                        );


                    const page =
                        doc.querySelector(
                            ".page"
                        );


                    if (page) {

                        editor.innerHTML =
                            page.innerHTML;

                    } else {

                        editor.innerHTML =
                            doc.body.innerHTML;

                    }


                    document
                        .getElementById(
                            "documentName"
                        )
                        .value =
                        file.name.replace(
                            /\.(html?|HTML?)$/,
                            ""
                        );


                    updateStatus();

                    autoSave();

                    editor.focus();

                };


            reader.readAsText(
                file
            );

        };


    input.click();
}


/* =========================================================
   新規文書
========================================================= */

function newDocument() {

    const ok =
        confirm(
            "現在の内容を消して、新しい文書を作成しますか？"
        );

    if (!ok) {
        return;
    }


    editor.innerHTML = "";


    document
        .getElementById(
            "documentName"
        )
        .value =
        "新しい文書";


    localStorage.removeItem(
        "wordEditorContent"
    );

    localStorage.removeItem(
        "wordEditorName"
    );


    savedRange = null;

    updateStatus();

    editor.focus();
}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}


/* =========================================================
   編集イベント
========================================================= */

editor.addEventListener(
    "input",
    function() {

        updateStatus();

        autoSave();

    }
);


editor.addEventListener(
    "mouseup",
    function() {

        saveSelection();

    }
);


editor.addEventListener(
    "keyup",
    function() {

        saveSelection();

    }
);


editor.addEventListener(
    "touchend",
    function() {

        /*
         * iOSで長押し選択した直後に
         * Rangeを保存する。
         */

        setTimeout(
            saveSelection,
            20
        );

    }
);


/* =========================================================
   キーボードショートカット
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            !(event.ctrlKey ||
              event.metaKey)
        ) {

            return;
        }


        const key =
            event.key.toLowerCase();


        if (key === "b") {

            event.preventDefault();

            saveSelection();

            execCommandSafe(
                "bold"
            );

        }


        if (key === "i") {

            event.preventDefault();

            saveSelection();

            execCommandSafe(
                "italic"
            );

        }


        if (key === "u") {

            event.preventDefault();

            saveSelection();

            execCommandSafe(
                "underline"
            );

        }


        if (key === "z") {

            event.preventDefault();

            saveSelection();

            if (event.shiftKey) {

                execCommandSafe(
                    "redo"
                );

            } else {

                execCommandSafe(
                    "undo"
                );

            }

        }


        if (key === "y") {

            event.preventDefault();

            saveSelection();

            execCommandSafe(
                "redo"
            );

        }

    }
);


/* =========================================================
   安全なexecCommand
========================================================= */

function execCommandSafe(
    command,
    value = null
) {

    restoreSelection();

    document.execCommand(
        command,
        false,
        value
    );

    saveSelection();

    updateStatus();

    autoSave();
}


/* =========================================================
   文書名
========================================================= */

document
    .getElementById(
        "documentName"
    )
    .addEventListener(
        "input",
        autoSave
    );


/* =========================================================
   モーダル
========================================================= */

document
    .getElementById(
        "linkModal"
    )
    .addEventListener(
        "pointerdown",
        function(event) {

            if (
                event.target === this
            ) {

                closeLinkModal();

            }

        }
    );


/* =========================================================
   起動
========================================================= */

window.addEventListener(
    "load",
    function() {

        restoreAutoSave();

        updateStatus();

        editor.focus();

    }
);

</script>
